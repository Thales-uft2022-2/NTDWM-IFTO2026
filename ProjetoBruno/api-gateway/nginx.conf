events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Formato de log estruturado com latência para observabilidade
    log_format microservices '$remote_addr - $remote_user [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log microservices;
    error_log /var/log/nginx/error.log warn;

    # Otimizações de rede
    sendfile        on;
    keepalive_timeout 65;

    # Upstreams com balanceamento Round-Robin nativo
    upstream auth_upstream {
        server auth-service:4001;
        keepalive 32;
    }

    upstream catalog_upstream {
        # O Docker DNS resolve 'catalog-service' para todas as réplicas ativas!
        server catalog-service:4002;
        keepalive 32;
    }

    upstream notification_upstream {
        server notification-service:4003;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck do próprio API Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"nginx","timestamp":"$time_iso8601"}';
        }

        # Rota para o Microserviço de Autenticação (v1)
        location /api/v1/auth/ {
            proxy_pass http://auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Rota para o Microserviço de Catálogo (v1)
        location /api/v1/products {
            proxy_pass http://catalog_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Rota para o Microserviço de Notificações / Auditoria (v1)
        location /api/v1/notifications/ {
            proxy_pass http://notification_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Página de erro customizada para falhas de upstream
        error_page 502 503 504 /gateway_error.json;
        location = /gateway_error.json {
            default_type application/json;
            return 503 '{"error":"Bad Gateway / Service Unavailable","gateway":"nginx","message":"Um dos microserviços está temporariamente inacessível."}';
        }
    }
}

apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  NODE_ENV: "production"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq.ecommerce.svc.cluster.local:5672"
  RABBITMQ_EXCHANGE: "ecommerce.events"
  AUTH_SERVICE_URL: "http://auth-service.ecommerce.svc.cluster.local:4001"
  JWT_EXPIRATION: "1h"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  JWT_SECRET: "super-secret-production-key-change-me"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"
